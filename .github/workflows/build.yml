name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: make test

      - name: Build Blink.app (universal)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          UNIVERSAL=1 make app
          ditto -c -k --keepParent dist/Blink.app dist/Blink.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Blink
          path: dist/Blink.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Blink.zip
          generate_release_notes: true
